    * { margin: 0; padding: 0; box-sizing: border-box; }

      background: #4ade80; color: #0a0a0f; border: none; border-radius: 8px;

    .gallery-label { text-align: center; margin-top: 4px; font-size: 11px; color: #666; }
    .info { margin-top: 16px; color: #555; font-size: 12px; text-align: center; max-width: 500px; }

  <p class="info">Colors are deterministically derived from keccak256(name). Traits (Tier, Class, Fluency, Pattern) are computed from the label string — reflecting actual TLD name value like domain registrars evaluate names.</p>

  <script>
  // ============================================================
  // KECCAK256-BASED COLOR GENERATION
  // ============================================================

  function keccak256Bytes(str) {
    if (typeof keccak_256 !== 'undefined') {
      const hash = keccak_256(str);
      const bytes = [];
      for (let i = 0; i < hash.length; i += 2) {
        bytes.push(parseInt(hash.substring(i, i + 2), 16));
      }
      return bytes;
    }
    const rounds = [];
    for (let r = 0; r < 8; r++) {
      let h = 0x811c9dc5 ^ (r * 0x9e3779b9);
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      for (let i = 0; i < 4; i++) {
        h ^= (h >>> 13);
        h = Math.imul(h, 0x5bd1e995 + r);
        h ^= (h >>> 15);
        rounds.push((h >>> (i * 8)) & 0xff);
      }
    }
    return rounds;
  }

  function nameToTokenId(name) {
    return keccak256Bytes(name);
  }

  function tokenToColorHex(tokenIdBytes, bitOffset) {
    const byteIdx = Math.floor(bitOffset / 8) % 32;
    const r = tokenIdBytes[byteIdx % 32];
    const g = tokenIdBytes[(byteIdx + 1) % 32];
    const b = tokenIdBytes[(byteIdx + 2) % 32];
    return ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
  }

  function getCircleCoord(tokenIdBytes, byteOffset) {
    return tokenIdBytes[byteOffset % 32];
  }

  function scale(n, inMn, inMx, outMn, outMx) {
    return Math.round((n - inMn) * (outMx - outMn) / (inMx - inMn) + outMn);
  }

  // ============================================================
  // NAME ANALYSIS — mirrors Solidity logic
  // ============================================================

  function isVowel(ch) {
    return 'aeiou'.includes(ch.toLowerCase());
  }

  function isAlpha(ch) {
    const c = ch.charCodeAt(0);
    return (c >= 97 && c <= 122); // lowercase a-z
  }

  function isDigit(ch) {
    const c = ch.charCodeAt(0);
    return (c >= 48 && c <= 57); // 0-9
  }

  // Map A: standard leet (4→a, 3→e, 1→l/i, 0→o, 5→s, 7→t, 8→b)
  function leetDecodeMapA(label, oneAs) {
    const map = { '4': 'a', '3': 'e', '0': 'o', '5': 's', '7': 't', '8': 'b', '1': oneAs || 'l' };
    return label.split('').map(c => map[c] || c).join('');
  }

  // Map B: calculator/visual leet (4→h, 3→e, 7→l, 1→i, 0→o, 5→s, 8→b, 6→g, 9→g)
  function leetDecodeMapB(label) {
    const map = { '4': 'h', '3': 'e', '7': 'l', '1': 'i', '0': 'o', '5': 's', '8': 'b', '6': 'g', '9': 'g' };
    return label.split('').map(c => map[c] || c).join('');
  }

  function isAllAlpha(str) {
    return /^[a-z]+$/.test(str);
  }

  // Try 3 decode strategies: Map A (1→l), Map A (1→i), Map B
  // Returns { decoded, isIconic } if decoded is a dictionary word, null if not
  function tryLeetDecode(label) {
    // Map A: 1→l
    let d = leetDecodeMapA(label, 'l');
    if (isAllAlpha(d) && DICTIONARY.has(d)) return { decoded: d, isIconic: ICONIC_LEET.has(label) };
    // Map A: 1→i
    d = leetDecodeMapA(label, 'i');
    if (isAllAlpha(d) && DICTIONARY.has(d)) return { decoded: d, isIconic: ICONIC_LEET.has(label) };
    // Map B: calculator leet
    d = leetDecodeMapB(label);
    if (isAllAlpha(d) && DICTIONARY.has(d)) return { decoded: d, isIconic: ICONIC_LEET.has(label) };
    return null;
  }

  function analyzeFluency(str) {
    const len = str.length;
    if (len === 0) return 'Standard';

    let vowels = 0;
    let consonantRun = 0;
    let clusters = 0; // clusters of 3+ consonants

    for (let i = 0; i < len; i++) {
      const ch = str[i];
      if (isVowel(ch)) {
        vowels++;
        consonantRun = 0;
      } else if (isAlpha(ch)) {
        consonantRun++;
        if (consonantRun === 3) clusters++;
      } else {
        consonantRun = 0;
      }
    }

    const ratio = (vowels * 100) / len;

    // Harsh: ratio <15 or >65, or 2+ consonant clusters
    if (ratio < 15 || ratio > 65 || clusters >= 2) return 'Harsh';
    // Euphonious: ratio 35-55, zero clusters
    if (ratio >= 35 && ratio <= 55 && clusters === 0) return 'Euphonious';
    // Fluent: ratio 25-60, max 1 cluster
    if (ratio >= 25 && ratio <= 60 && clusters <= 1) return 'Fluent';
    // Standard: anything else
    return 'Standard';
  }

  function analyzeCharClass(label) {
    let hasAlpha = false, hasDigit = false, hasHyphen = false;

    for (let i = 0; i < label.length; i++) {
      const ch = label[i];
      if (isAlpha(ch)) hasAlpha = true;
      else if (isDigit(ch)) hasDigit = true;
      else if (ch === '-') hasHyphen = true;
    }

    if (hasHyphen) return 'Hyphenated';

    // Check leetspeak via dictionary lookup
    if (hasDigit) {
      const result = tryLeetDecode(label);
      if (result) return 'Leetspeak';
      return hasAlpha ? 'Alphanumeric' : 'Numeric';
    }

    return 'Pure Alpha';
  }

  function analyzePattern(label) {
    const len = label.length;
    if (len < 2) return 'Standard';

    // Palindrome check
    let isPalindrome = true;
    for (let i = 0; i < Math.floor(len / 2); i++) {
      if (label[i] !== label[len - 1 - i]) { isPalindrome = false; break; }
    }
    if (isPalindrome) return 'Palindrome';

    // Repeating check (all same char, or repeating pattern like "abab")
    const allSame = label.split('').every(c => c === label[0]);
    if (allSame) return 'Repeating';
    if (len >= 4) {
      // Check for 2-char repeat: "abab", "xyxy"
      const half = Math.floor(len / 2);
      const pattern = label.substring(0, half);
      if (pattern.repeat(Math.ceil(len / half)).substring(0, len) === label) return 'Repeating';
    }

    // Sequential check (abc, 123, xyz)
    let isSeq = true;
    for (let i = 1; i < len; i++) {
      if (label.charCodeAt(i) !== label.charCodeAt(i - 1) + 1) { isSeq = false; break; }
    }
    if (isSeq) return 'Sequential';

    // Reverse sequential (zyx, 987)
    let isRevSeq = true;
    for (let i = 1; i < len; i++) {
      if (label.charCodeAt(i) !== label.charCodeAt(i - 1) - 1) { isRevSeq = false; break; }
    }
    if (isRevSeq) return 'Sequential';

    return 'Standard';
  }

  function analyzeTier(label) {
    const charClass = analyzeCharClass(label);

    // Leetspeak: tier based on decoded word length (parity with readable names)
    // EXCEPT iconic leet forms → Ultra Rare override
    if (charClass === 'Leetspeak') {
      const result = tryLeetDecode(label);
      if (result && result.isIconic) return 'Ultra Rare';
      const effectiveLen = result ? result.decoded.length : label.length;
      if (effectiveLen <= 2) return 'Ultra Rare';
      if (effectiveLen === 3) return 'Legendary';
      if (effectiveLen === 4) return 'Epic';
      if (effectiveLen <= 7) return 'Rare';
      if (effectiveLen <= 9) return 'Uncommon';
      return 'Common';
    }

    // Non-leet: tier based on label length
    const len = label.length;
    if (len <= 2) return 'Ultra Rare';
    if (len === 3) return 'Legendary';
    if (len === 4) return 'Epic';
    if (len <= 7) return 'Rare';
    if (len <= 9) return 'Uncommon';
    return 'Common';
  }

  function analyzeLabel(label) {
    const charClass = analyzeCharClass(label);
    let fluency;
    let decoded = '';
    let isIconic = false;
    if (charClass === 'Leetspeak') {
      const result = tryLeetDecode(label);
      decoded = result ? result.decoded : '';
      isIconic = result ? result.isIconic : false;
      // Fluency is based on the decoded word
      fluency = decoded ? analyzeFluency(decoded) : 'Standard';
    } else {
      fluency = analyzeFluency(label);
    }
    const pattern = analyzePattern(label);
    const tier = analyzeTier(label);
    return { tier, charClass, fluency, pattern, decoded, isIconic };
  }

    return `
      <g style="transform:translate(436px, 420px)">
        <rect width="36px" height="36px" rx="8px" ry="8px" fill="none" stroke="rgba(255,255,255,0.2)"/>
        <g>
          <path style="transform:translate(6px,6px)"
            d="M12 0L12.6522 9.56587L18 1.6077L13.7819 10.2181L22.3923 6L14.4341
            11.3478L24 12L14.4341 12.6522L22.3923 18L13.7819 13.7819L18 22.3923L12.6522 14.4341L12 24L11.3478 14.4341L6 22.3923L10.2181 13.7819L1.6077 18L9.56587 12.6522L0 12L9.56587 11.3478L1.6077 6L10.2181 10.2181L6 1.6077L11.3478 9.56587L12 0Z"
            fill="white"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0 18 18" to="360 18 18" dur="10s" repeatCount="indefinite"/>
        </g>
      </g>`;
  }

  function dataBadge(yPos, labelText, valueText, fid) {
    const width = 7 * (labelText.length + valueText.length + 4);
    return `
      <g style="transform:translate(29px, ${yPos}px)">
        <rect width="${width}px" height="26px" rx="8px" ry="8px" fill="rgba(0,0,0,0.6)"/>
        <text x="12px" y="17px" font-family="'Courier New', monospace" font-size="12px" fill="white">
          <tspan fill="rgba(255,255,255,0.6)">${labelText}</tspan>${valueText}
        </text>
      </g>`;
  }

  // ============================================================
  // MAIN SVG BUILDER
  // ============================================================

  function buildRevealedSvg(opts) {
    const name = opts.name || 'alice';
    const nameLen = name.length;
    const chain = opts.chain || 'Mordor';
    const expiryDays = opts.expiryDays !== undefined ? opts.expiryDays : 365;

    // Analyze label traits
    const traits = analyzeLabel(name);

    // Derive tokenId bytes from keccak256(name)
    const tid = nameToTokenId(name);

    // Extract 4 colors at well-separated byte offsets
    const color0 = tokenToColorHex(tid, 0);
    const color1 = tokenToColorHex(tid, 48);
    const color2 = tokenToColorHex(tid, 96);
    const color3 = tokenToColorHex(tid, 152);

    // Circle positions
    const x1 = scale(getCircleCoord(tid, 3), 0, 255, 16, 484);
    const y1 = scale(getCircleCoord(tid, 7), 0, 255, 16, 484);
    const x2 = scale(getCircleCoord(tid, 11), 0, 255, 16, 484);
    const y2 = scale(getCircleCoord(tid, 15), 0, 255, 16, 484);
    const x3 = scale(getCircleCoord(tid, 19), 0, 255, 16, 484);
    const y3 = scale(getCircleCoord(tid, 23), 0, 255, 16, 484);

    const border = borderColors[opts.border || 0];
    const glowColor = glowColors[opts.glow || 0];
    const textureIdx = opts.texture || 0;

    // Show color swatches + traits
    if (opts.showColors) {
      document.getElementById('colorPreview').innerHTML = `
        <div class="color-swatch" style="background:#${color0}"></div>
        <div class="color-swatch" style="background:#${color1}"></div>
        <div class="color-swatch" style="background:#${color2}"></div>
        <div class="color-swatch" style="background:#${color3}"></div>
        <span class="color-label">#${color0} #${color1} #${color2} #${color3}</span>
      `;
      const decoded = traits.decoded ? ` (decoded: "${traits.decoded}")` : '';
      document.getElementById('traitPreview').innerHTML = `
        <div><span class="trait-label">Tier:</span><span class="trait-value">${traits.tier}</span></div>
        <div><span class="trait-label">Character Class:</span><span class="trait-value">${traits.charClass}${decoded}</span></div>
        <div><span class="trait-label">Fluency:</span><span class="trait-value">${traits.fluency}</span></div>
        <div><span class="trait-label">Pattern:</span><span class="trait-value">${traits.pattern}</span></div>
        <div><span class="trait-label">Chain:</span><span class="trait-value">${chain}</span></div>
        <div><span class="trait-label">Expiry:</span><span class="trait-value">${expiryDays} days</span></div>
      `;
    }

    const outerGlow = glowColor !== 'none' ?
      `<rect x="-4" y="-4" width="508" height="508" rx="46" ry="46" fill="none" stroke="${glowColor}" stroke-width="2" opacity=".15">
        <animate attributeName="opacity" values=".1;.25;.1" dur="3s" repeatCount="indefinite"/>
      </rect>` : '';

    const fid = 'f' + name.replace(/[^a-z0-9]/gi, '');

    // Dynamic font size
    const totalChars = nameLen + 4;
    let fontSize;
    if (totalChars <= 7) fontSize = 72;
    else if (totalChars <= 8) fontSize = 64;
    else if (totalChars <= 10) fontSize = 48;
    else if (totalChars <= 13) fontSize = 36;
    else if (totalChars <= 18) fontSize = 28;
    else fontSize = 22;

    // Expiry display
    const expiryText = expiryDays <= 0 ? 'Expired' : `${expiryDays}d`;

    // Build badges — fixed spacing (30px apart), conditional 4th badge
    let badges = '';
    badges += dataBadge(388, 'Tier: ', traits.tier);
    badges += dataBadge(416, 'Class: ', traits.charClass);
    badges += dataBadge(444, 'Fluency: ', traits.fluency);
    if (traits.pattern !== 'Standard') {
      badges += dataBadge(466, 'Pattern: ', traits.pattern);
    }

    return `<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <filter id="${fid}">
          <feImage result="p0" xlink:href="data:image/svg+xml;base64,${btoa(`<svg width='500' height='500' viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'><rect width='500' height='500' fill='#${color0}'/></svg>`)}"/>
          <feImage result="p1" xlink:href="data:image/svg+xml;base64,${btoa(`<svg width='500' height='500' viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'><circle cx='${x1}' cy='${y1}' r='120px' fill='#${color1}'/></svg>`)}"/>
          <feImage result="p2" xlink:href="data:image/svg+xml;base64,${btoa(`<svg width='500' height='500' viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'><circle cx='${x2}' cy='${y2}' r='120px' fill='#${color2}'/></svg>`)}"/>
          <feImage result="p3" xlink:href="data:image/svg+xml;base64,${btoa(`<svg width='500' height='500' viewBox='0 0 500 500' xmlns='http://www.w3.org/2000/svg'><circle cx='${x3}' cy='${y3}' r='100px' fill='#${color3}'/></svg>`)}"/>
          <feBlend mode="overlay" in="p0" in2="p1"/>
          <feBlend mode="exclusion" in2="p2"/>
          <feBlend mode="overlay" in2="p3" result="blendOut"/>
          <feGaussianBlur in="blendOut" stdDeviation="42"/>
        </filter>
        <clipPath id="c${fid}"><rect width="500" height="500" rx="42" ry="42"/></clipPath>
        <path id="tp${fid}" d="M40 12 H460 A28 28 0 0 1 488 40 V460 A28 28 0 0 1 460 488 H40 A28 28 0 0 1 12 460 V40 A28 28 0 0 1 40 12 z"/>
        <filter id="trb${fid}"><feGaussianBlur in="SourceGraphic" stdDeviation="24"/></filter>
      </defs>

      ${outerGlow}

      <g clip-path="url(#c${fid})">
        <rect fill="#${color0}" x="0" y="0" width="500" height="500"/>
        <rect style="filter: url(#${fid})" x="0" y="0" width="500" height="500"/>
        <g style="filter:url(#trb${fid}); transform:scale(1.5); transform-origin:center top;">
          <rect fill="none" x="0" y="0" width="500" height="500"/>
          <ellipse cx="50%" cy="0px" rx="280px" ry="120px" fill="#000" opacity="0.85"/>
        </g>
        ${textureSvg(textureIdx)}
        <rect x="0" y="0" width="500" height="500" rx="42" ry="42" fill="rgba(0,0,0,0)" stroke="${border.stroke}"/>
      </g>

      <!-- Animated border text -->
      <text text-rendering="optimizeSpeed">
        <textPath startOffset="-100%" fill="white" font-family="'Courier New', monospace" font-size="10px" xlink:href="#tp${fid}">
          ${name}.etc &#x2022; Ethereum Classic Name Service
          <animate additive="sum" attributeName="startOffset" from="0%" to="100%" begin="0s" dur="30s" repeatCount="indefinite"/>
        </textPath>
        <textPath startOffset="0%" fill="white" font-family="'Courier New', monospace" font-size="10px" xlink:href="#tp${fid}">
          ${name}.etc &#x2022; Ethereum Classic Name Service
          <animate additive="sum" attributeName="startOffset" from="0%" to="100%" begin="0s" dur="30s" repeatCount="indefinite"/>
        </textPath>
        <textPath startOffset="50%" fill="white" font-family="'Courier New', monospace" font-size="10px" xlink:href="#tp${fid}">
          ECNS &#x2022; .etc &#x2022; On-Chain Identity
          <animate additive="sum" attributeName="startOffset" from="0%" to="100%" begin="0s" dur="30s" repeatCount="indefinite"/>
        </textPath>
        <textPath startOffset="-50%" fill="white" font-family="'Courier New', monospace" font-size="10px" xlink:href="#tp${fid}">
          ECNS &#x2022; .etc &#x2022; On-Chain Identity
          <animate additive="sum" attributeName="startOffset" from="0%" to="100%" begin="0s" dur="30s" repeatCount="indefinite"/>
        </textPath>
      </text>

      <!-- Centered name display -->
      <text y="230" x="250" text-anchor="middle" fill="white" font-family="'Courier New', monospace" font-weight="200" font-size="${fontSize}px">${name}.etc</text>

      <!-- ECNS branding -->
      <text y="270" x="250" text-anchor="middle" fill="white" opacity=".3" font-family="'Courier New', monospace" font-size="12px" font-weight="bold" letter-spacing="3">ECNS</text>

      <!-- Inner border -->
      <rect x="16" y="16" width="468" height="468" rx="26" ry="26" fill="rgba(0,0,0,0)" stroke="${border.accent}"/>

      <!-- Data badges -->
      ${badges}

      <!-- Expiry (bottom-right, subtle) -->
      <text x="470" y="478" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="'Courier New', monospace" font-size="10px">${expiryText}</text>

      <!-- Chain (top-right, subtle) -->
      <text x="460" y="50" text-anchor="end" fill="rgba(255,255,255,0.3)" font-family="'Courier New', monospace" font-size="10px">${chain}</text>

      ${rareSparkleSvg(traits.tier)}
    </svg>`;
  }

  // ============================================================
  // UI
  // ============================================================

  function getOpts() {
    return {
      name: document.getElementById('nameInput').value || 'name',
      expiryDays: parseInt(document.getElementById('expiryInput').value) || 365,
      chain: document.getElementById('chainSelect').value,
      texture: parseInt(document.getElementById('textureSelect').value),
      border: parseInt(document.getElementById('borderSelect').value),
      glow: parseInt(document.getElementById('glowSelect').value),
    };
  }

  function render() {
    const opts = getOpts();
    opts.showColors = true;
    document.getElementById('nftFrame').innerHTML = buildRevealedSvg(opts);

    // Gallery: diverse names showing trait variety
    const names = ['eth', 'h4x0r', '1337', '43770', 'alice', '42069', 'b4d', 'my-name'];
    let html = '';
    names.forEach(n => {
      const t = analyzeLabel(n);
      html += `<div>
        <div class="gallery-item">${buildRevealedSvg({
          name: n, texture: 0, border: 0, glow: 6, chain: 'Mordor', expiryDays: 365
        })}</div>
        <div class="gallery-label">${n}.etc — ${t.tier}, ${t.charClass}${t.decoded ? ' → '+t.decoded : ''}</div>
      </div>`;
    });
    document.getElementById('gallery').innerHTML = html;
  }

  function randomize() {
    const selects = ['textureSelect','borderSelect','glowSelect'];
    selects.forEach(id => {
      const el = document.getElementById(id);
      el.selectedIndex = Math.floor(Math.random() * el.options.length);
    });
    const leets = ['alice','h4x0r','1337','n00b','vitalik','eth','43770','42069','aba','my-name','ph34r','classic','b4d','31337','80085','12345','str0ng'];
    document.getElementById('nameInput').value = leets[Math.floor(Math.random() * leets.length)];
    render();
  }

  render();
  </script>
</body>
</html>
